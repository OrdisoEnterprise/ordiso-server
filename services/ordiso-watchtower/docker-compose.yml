---
services:
  watchtower-docker-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:latest
    container_name: ordiso-watchtower-docker-proxy
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - NETWORKS=1
      - VOLUMES=1
      - INFO=1
      - PING=1
      - VERSION=1
      - POST=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - ordiso-watchtower-internal

  watchtower:
    image: containrrr/watchtower
    container_name: ordiso-watchtower
    restart: unless-stopped
    environment:
      - DOCKER_API_VERSION=1.54
      - DOCKER_HOST=tcp://watchtower-docker-proxy:2375
    command: --interval 30 --label-enable
    networks:
      - ordiso-watchtower-internal

networks:
  ordiso-watchtower-internal:
    name: ordiso-watchtower-internal
    driver: bridge
    internal: true
